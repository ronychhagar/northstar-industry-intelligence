[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-industry-intelligence"
version = "1.0.0"
description = "Multi-industry research-as-a-service workspace with an engineering calibration module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "scipy>=1.9",
    "torch>=2.0",
]

[project.optional-dependencies]
app = ["pandas>=2.0", "streamlit>=1.30"]
test = ["pytest>=7"]

[project.scripts]
northstar-research = "robotics_twin.app:main"
motionlab-robotics = "robotics_twin.app:main"
thermal-pinn-benchmark = "thermal_pinn.experiment:main"

[tool.setuptools.packages.find]
include = ["robotics_twin*", "thermal_pinn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
